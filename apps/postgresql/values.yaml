auth:
  existingSecret: "postgresql-secret"
  secretKeys:
    adminPasswordKey: "postgres-password"
  username: postgres
  database: postgres

primary:
  persistence:
    enabled: true
    storageClass: "longhorn"
    size: 10Gi

primary:
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

metrics:
  enabled: true
  serviceMonitor:
    enabled: false

service:
  type: ClusterIP

