apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkding-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
--- 
apiVersion: v1
kind: Secret
metadata:
  name: linkding-db-secret
  namespace: linkding
type: Opaque
stringData:
  DB_USER: linkding_user
  DB_PASSWORD: linkK4spar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
  namespace: linkding
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      containers:
      - name: linkding
        image: sissbruecker/linkding:latest
        ports:
        - containerPort: 9090
        env:
        - name: LD_DB_ENGINE
          value: "postgres"
        - name: LD_DB_DATABASE
          value: "linkding"
        - name: LD_DB_USER
          valueFrom:
            secretKeyRef:
              name: linkding-db-secret
              key: DB_USER
        - name: LD_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: linkding-db-secret
              key: DB_PASSWORD
        - name: LD_DB_HOST
          value: "postgres.databases.svc.cluster.local"
        - name: LD_DB_PORT
          value: "5432"
        volumeMounts:
        - name: linkding-data
          mountPath: /etc/linkding/data
      volumes:
      - name: linkding-data
        persistentVolumeClaim:
          claimName: linkding-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: linkding
  namespace: linkding
spec:
  selector:
    app: linkding
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9090
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkding
  namespace: linkding
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: linkding.lab.hpersson.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkding
                port:
                  number: 80
  tls:
    - hosts:
        - linkding.lab.hpersson.com
      secretName: linkding-tls
